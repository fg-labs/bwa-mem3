name: CI

on:
  push:
    branches: [master, fg-main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch_flag: "sse41"
            use_mimalloc: "1"
            name: "Linux x86_64 SSE4.1 (mimalloc)"
          - os: ubuntu-latest
            arch_flag: "avx2"
            use_mimalloc: "1"
            canonical: true
            name: "Linux x86_64 AVX2 (mimalloc)"
          - os: ubuntu-latest
            arch_flag: "avx2"
            use_mimalloc: "0"
            name: "Linux x86_64 AVX2 (no-mimalloc)"
          - os: ubuntu-24.04-arm
            arch_flag: ""
            use_mimalloc: "1"
            name: "Linux ARM64 (mimalloc)"
          - os: macos-latest
            arch_flag: ""
            use_mimalloc: "1"
            name: "macOS ARM64 (mimalloc)"
          - os: ubuntu-latest
            arch_flag: "multi"
            use_mimalloc: "1"
            name: "Linux x86_64 multi (mimalloc)"
          - os: ubuntu-latest
            arch_flag: "avx2"
            use_mimalloc: "1"
            cxx: "clang++"
            name: "Linux x86_64 AVX2 clang (mimalloc)"

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev bwa autoconf automake samtools libomp-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bwa autoconf automake libomp

      - name: Verify CMake is available
        run: cmake --version

      - name: Build bwa-mem2
        run: |
          if [ "${{ matrix.arch_flag }}" = "" ]; then
            make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)" \
              CXX=${{ matrix.cxx || 'g++' }} USE_MIMALLOC=${{ matrix.use_mimalloc }}
          elif [ "${{ matrix.arch_flag }}" = "multi" ]; then
            make -j"$(nproc)" multi \
              CXX=${{ matrix.cxx || 'g++' }} USE_MIMALLOC=${{ matrix.use_mimalloc }}
          else
            make -j"$(nproc)" \
              arch=${{ matrix.arch_flag }} \
              CXX=${{ matrix.cxx || 'g++' }} USE_MIMALLOC=${{ matrix.use_mimalloc }}
          fi

      - name: Verify binary
        run: ./bwa-mem2 version

      - name: Build doctest framework and unit binary
        run: make -C test framework unit

      - name: Run unit tests (all rows)
        env:
          BWA_MEM2_TEST_MATRIX_ROW: ${{ matrix.name }}
        # `--reporters=junit --out=…` writes JUnit XML to the file and
        # nothing to stdout, so on failure dump the XML to the job log to
        # surface failing assertions inline. (`--reporters=console,junit`
        # would interleave console output into the same `--out` file and
        # corrupt the JUnit XML, so the reporters must run separately.)
        run: |
          ./test/bwa_mem2_tests_unit \
            --reporters=junit \
            --out=unit-results-${{ strategy.job-index }}.xml \
          || { cat unit-results-${{ strategy.job-index }}.xml; exit 1; }

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v4.3.3
        with:
          name: unit-results-${{ matrix.name }}
          path: unit-results-*.xml

      - name: Verify mimalloc is linked (when enabled)
        if: matrix.use_mimalloc == '1'
        run: test/mimalloc_loaded_test.sh ./bwa-mem2

      - name: Verify mimalloc is NOT linked (when disabled)
        if: matrix.use_mimalloc == '0'
        run: |
          if test/mimalloc_loaded_test.sh ./bwa-mem2; then
            echo "FAIL: USE_MIMALLOC=0 build should NOT report mimalloc" >&2
            exit 1
          fi
          echo "PASS: no-mimalloc build correctly omits mimalloc"

      - name: Build dwgsim
        run: |
          git clone --recursive https://github.com/nh13/DWGSIM.git /tmp/dwgsim-src
          cd /tmp/dwgsim-src
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Download phiX174 reference
        run: |
          mkdir -p /tmp/ci-test
          curl -sL "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/819/615/GCF_000819615.1_ViralProj14015/GCF_000819615.1_ViralProj14015_genomic.fna.gz" \
            | gunzip > /tmp/ci-test/phix174.fa

      - name: Simulate reads with dwgsim
        run: |
          # Pin -z so the simulated reads are reproducible across CI runs.
          # Without this, each job gets a different time-seeded batch and a
          # stray read spanning the phiX174 circular origin can produce a
          # byte-level diff vs bwa, flaking the comparison step. See issue
          # #11 for plans to replace this test with a curated dataset
          # (via holodeck) and drop dwgsim entirely.
          /tmp/dwgsim-src/dwgsim \
            -z 42 \
            -N 500 -1 150 -2 150 \
            -r 0.001 -S 2 \
            /tmp/ci-test/phix174.fa \
            /tmp/ci-test/reads

      - name: Compare bwa and bwa-mem2 output (phiX parity)
        run: |
          BWA_MEM2="$GITHUB_WORKSPACE/bwa-mem2" \
          CI_TEST_DIR=/tmp/ci-test \
          bash test/regression/phix_parity.sh

      - name: Run unit-test harness
        if: matrix.canonical == true || matrix.arch_flag == 'sse41'
        run: |
          bash test/run_unit_tests.sh

      - name: --bam=6 roundtrip smoke (phiX)
        if: matrix.canonical == true
        run: |
          BWA_MEM2="$GITHUB_WORKSPACE/bwa-mem2" \
          CI_TEST_DIR=/tmp/ci-test \
          bash test/regression/bam_roundtrip.sh

      - name: Thread-determinism smoke (phiX, -t 1 vs -t 4)
        if: matrix.canonical == true
        run: |
          BWA_MEM2="$GITHUB_WORKSPACE/bwa-mem2" \
          CI_TEST_DIR=/tmp/ci-test \
          bash test/regression/thread_determinism.sh

      - name: Cache chr22 reference
        if: matrix.canonical == true
        id: cache-chr22
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/chr22
          key: chr22-hg38-ucsc-v1

      - name: Download chr22 reference (hg38)
        if: matrix.canonical == true && steps.cache-chr22.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/chr22
          curl -sL "https://hgdownload.soe.ucsc.edu/goldenPath/hg38/chromosomes/chr22.fa.gz" \
            | gunzip > /tmp/chr22/chr22.fa
          test -s /tmp/chr22/chr22.fa
          echo "chr22.fa bytes: $(wc -c < /tmp/chr22/chr22.fa)"

      - name: Build chr22 FMI index
        if: matrix.canonical == true
        run: |
          cd /tmp/chr22
          $GITHUB_WORKSPACE/bwa-mem2 index chr22.fa
          ls chr22.fa.*

      - name: Simulate chr22 reads with dwgsim
        if: matrix.canonical == true
        run: |
          mkdir -p /tmp/chr22-sim
          /tmp/dwgsim-src/dwgsim \
            -z 42 \
            -N 50000 -1 150 -2 150 \
            -r 0.001 -S 2 \
            /tmp/chr22/chr22.fa /tmp/chr22-sim/reads

      - name: Compare chr22 bwa vs bwa-mem2 (parity)
        if: matrix.canonical == true
        run: |
          BWA_MEM2="$GITHUB_WORKSPACE/bwa-mem2" \
          CHR22_FA=/tmp/chr22/chr22.fa \
          CHR22_SIM_DIR=/tmp/chr22-sim \
          bash test/regression/chr22_parity.sh

      - name: SE alignment smoke (chr22)
        if: matrix.canonical == true
        run: |
          $GITHUB_WORKSPACE/bwa-mem2 mem -t 4 /tmp/chr22/chr22.fa \
            /tmp/chr22-sim/reads.bwa.read1.fastq.gz > /tmp/chr22-sim/se.sam 2>/dev/null
          records=$(grep -cv '^@' /tmp/chr22-sim/se.sam)
          [ "$records" -gt 0 ] || { echo "FAIL: SE alignment produced zero records"; exit 1; }
          grep -q '^@PG.*bwa-mem2' /tmp/chr22-sim/se.sam || { echo "FAIL: SE missing @PG"; exit 1; }
          echo "PASS: SE smoke ($records records)"

      - name: Interleaved alignment smoke (chr22)
        if: matrix.canonical == true
        run: |
          # Interleave R1 and R2 into a single FASTQ at FASTQ-record (4-line)
          # granularity. The naive `paste R1 R2 | tr '\t' '\n'` interleaves at
          # line granularity, which produces a malformed FASTQ. Collapse each
          # input to one tab-separated row per record first (`paste - - - -`),
          # then interleave whole records, then re-expand tabs to newlines.
          paste -d '\n' \
            <(zcat /tmp/chr22-sim/reads.bwa.read1.fastq.gz | paste - - - -) \
            <(zcat /tmp/chr22-sim/reads.bwa.read2.fastq.gz | paste - - - -) \
            | tr '\t' '\n' > /tmp/chr22-sim/interleaved.fq
          $GITHUB_WORKSPACE/bwa-mem2 mem -p -t 4 /tmp/chr22/chr22.fa \
            /tmp/chr22-sim/interleaved.fq > /tmp/chr22-sim/p.sam 2>/dev/null
          records=$(grep -cv '^@' /tmp/chr22-sim/p.sam)
          [ "$records" -gt 0 ] || { echo "FAIL: interleaved alignment produced zero records"; exit 1; }
          # 50,000 simulated PE pairs × 2 reads = 100,000 input reads, so a
          # properly interleaved input must produce at least one SAM line per
          # read (primary alignment, mapped or unmapped). Tolerate >= because
          # secondary/supplementary alignments add extra lines. Without this
          # floor the previous `paste | tr` (line-interleaved, malformed FASTQ)
          # silently passed at ~50k records — half the reads, parser-tolerated.
          [ "$records" -ge 100000 ] || { echo "FAIL: expected >=100000 records, got $records"; exit 1; }
          echo "PASS: interleaved smoke ($records records)"

      - name: Install pixi (for --meth oracle)
        if: matrix.canonical == true
        uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          pixi-version: v0.49.0
          manifest-path: test/meth/pyproject.toml
          cache: true

      - name: Checkout bwa-meth oracle
        if: matrix.canonical == true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: brentp/bwa-meth
          path: bwa-meth-oracle

      - name: Copy bwa-meth fixtures into test/meth/
        if: matrix.canonical == true
        run: |
          cp bwa-meth-oracle/example/ref.fa test/meth/
          cp bwa-meth-oracle/example/t_R1.fastq.gz test/meth/
          cp bwa-meth-oracle/example/t_R2.fastq.gz test/meth/
          ls -la test/meth/

      - name: Run --meth Layers 1-3
        if: matrix.canonical == true
        env:
          BWAMETH_DIR: ${{ github.workspace }}/bwa-meth-oracle
        run: bash test/regression/meth_oracle.sh
