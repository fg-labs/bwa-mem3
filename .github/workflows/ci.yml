name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN. Without this block the token inherits the
# repository default, which -- depending on the org/repo setting -- can be
# read/write across contents, issues, pull requests and more, far beyond what
# any job here needs. Nothing in this workflow uses the token except
# actions/checkout, so `contents: read` is the whole requirement:
#
#   - actions/upload-artifact and actions/cache authenticate with
#     ACTIONS_RUNTIME_TOKEN, which the runner injects independently of
#     `permissions:` -- they need no grant here.
#   - codecov-action uploads tokenless (no `token:`/`use_oidc:` below), so it
#     needs neither `id-token: write` nor a secret.
#
# release.yml is the counterexample worth keeping in view: it starts from
# `permissions: {}` and grants `contents`/`pull-requests` write per job,
# because its jobs genuinely differ. Here all three jobs need exactly
# `contents: read`, so it is declared once at the workflow level.
permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      # Each row carries `artifact_slug` (a-z0-9-) alongside the human-
      # friendly `name`. Artifact uploads use the slug to keep names URL-
      # safe and free of spaces / parens; job titles still use `name`.
      matrix:
        include:
          - os: ubuntu-latest
            arch_flag: "sse41"
            use_mimalloc: "1"
            run_integration: true
            name: "Linux x86_64 SSE4.1 (mimalloc)"
            artifact_slug: "linux-x86_64-sse41-mimalloc"
          - os: ubuntu-latest
            arch_flag: "avx2"
            use_mimalloc: "1"
            canonical: true
            run_integration: true
            name: "Linux x86_64 AVX2 (mimalloc)"
            artifact_slug: "linux-x86_64-avx2-mimalloc"
          - os: ubuntu-latest
            arch_flag: "avx2"
            use_mimalloc: "0"
            name: "Linux x86_64 AVX2 (no-mimalloc)"
            artifact_slug: "linux-x86_64-avx2-no-mimalloc"
          - os: ubuntu-24.04-arm
            arch_flag: ""
            use_mimalloc: "1"
            run_integration: true
            name: "Linux ARM64 (mimalloc)"
            artifact_slug: "linux-arm64-mimalloc"
          - os: macos-latest
            arch_flag: ""
            use_mimalloc: "1"
            run_integration: true
            name: "macOS ARM64 (mimalloc)"
            artifact_slug: "macos-arm64-mimalloc"
          - os: ubuntu-latest
            arch_flag: ""
            use_mimalloc: "1"
            run_integration: true
            name: "Linux x86_64 single-binary (mimalloc)"
            artifact_slug: "linux-x86_64-single-mimalloc"
          # Same single-binary build as the row above, but with the
          # BASELINE_ARCH override flipped to sse41 (the vintage-host
          # portability path). PR #83 originally hardcoded the sse41
          # baseline; the perf-regression fix flipped the default to avx2
          # and made it tunable. Keep this row so the override path stays
          # exercised — without it, a future refactor could silently drop
          # sub-avx2 portability.
          - os: ubuntu-latest
            arch_flag: ""
            baseline_arch: "sse41"
            use_mimalloc: "1"
            run_integration: true
            name: "Linux x86_64 single-binary BASELINE_ARCH=sse41 (mimalloc)"
            artifact_slug: "linux-x86_64-single-sse41-baseline-mimalloc"
          - os: ubuntu-latest
            arch_flag: "avx2"
            use_mimalloc: "1"
            cxx: "clang++"
            name: "Linux x86_64 AVX2 clang (mimalloc)"
            artifact_slug: "linux-x86_64-avx2-clang-mimalloc"

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Do not leave the GITHUB_TOKEN in .git/config after checkout. The
          # steps that follow run the repository's own build scripts and the
          # vendored submodules' configure/make, none of which does any git
          # operation needing auth -- so a persisted credential is reachable
          # by that code for no benefit. `submodules: recursive` is unaffected;
          # checkout authenticates the submodule fetch inline. profiling-build
          # below already set this; all four checkouts now agree.
          persist-credentials: false
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        # libomp-dev is required so `clang++ -fopenmp` can find -lomp when
        # building the test framework on the AVX2 clang matrix row. On g++
        # rows it's unused — libgomp ships with g++.
        #
        # libdeflate-dev exercises the htslib_static.mk transitive-deps
        # path: htslib's configure auto-detects libdeflate and libhts.a
        # then references libdeflate_* symbols that resolve via -ldeflate
        # from $(HTSLIB_static_LIBS). Without this on the runner, the
        # libdeflate-enabled link path is invisible to CI.
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: zlib1g-dev libdeflate-dev bwa autoconf automake samtools libomp-dev
          version: 1.1

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bwa autoconf automake libomp libdeflate

      - name: Verify CMake is available
        run: cmake --version

      - name: Build bwa-mem3
        # For arch_flag="" rows the build goes through the single: target,
        # which honors BASELINE_ARCH (defaults to avx2; override per-row via
        # matrix.baseline_arch). On ARM rows BASELINE_ARCH is harmless — the
        # single: recipe short-circuits to the arm64 build before consulting
        # it. On rows that pin arch=… we hit a single-arch build that bypasses
        # single: entirely, so BASELINE_ARCH is not used and is omitted.
        run: |
          if [ "${{ matrix.arch_flag }}" = "" ]; then
            make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)" \
              BASELINE_ARCH=${{ matrix.baseline_arch || 'avx2' }} \
              CXX=${{ matrix.cxx || 'g++' }} USE_MIMALLOC=${{ matrix.use_mimalloc }}
          else
            make -j"$(nproc)" \
              arch=${{ matrix.arch_flag }} \
              CXX=${{ matrix.cxx || 'g++' }} USE_MIMALLOC=${{ matrix.use_mimalloc }}
          fi

      - name: Verify binary
        run: ./bwa-mem3 version

      - name: Build doctest framework and unit binary
        # Invoke via the parent `test-binaries` target so ARCH_FLAGS
        # propagate from libbwa.a's build into the test CXXFLAGS. Ensures
        # BWA_TESTS_HAVE_KSWV in kswv_runner.h evaluates consistently
        # between libbwa.a and the test binary (notably: sse41 row has
        # no kswv::getScores8 symbol, so tests must be compiled out).
        # For arch_flag="" rows (ARM, macOS, single-binary x86), the parent
        # build auto-selects ARCH_FLAGS via IS_ARM (ARM) or falls back to
        # the file-default -msse4.1 floor (x86 single-binary, which compiled
        # all tier kernels separately; the test TU compiles at sse41 here
        # regardless of BASELINE_ARCH, so kswv tests gate on BWA_TESTS_HAVE_KSWV
        # and skip when the test TU lacks __AVX2__/__AVX512BW__).
        run: |
          if [ "${{ matrix.arch_flag }}" = "" ]; then
            make test-binaries CXX=${{ matrix.cxx || 'g++' }}
          else
            make test-binaries arch=${{ matrix.arch_flag }} CXX=${{ matrix.cxx || 'g++' }}
          fi

      - name: Run unit tests (all rows)
        env:
          BWA_MEM3_TEST_MATRIX_ROW: ${{ matrix.name }}
        # `--reporters=junit --out=…` writes JUnit XML to the file and
        # nothing to stdout. doctest itself prints the failing-assertion
        # summary to stderr before exiting non-zero, so the per-step log
        # already surfaces the diagnosis; the JUnit XML is only consumed
        # via the upload-artifact step below.
        run: |
          ./test/bwa_mem3_tests_unit \
            --reporters=junit \
            --out=unit-results-${{ strategy.job-index }}.xml

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Sanitize matrix.name (contains spaces and parens like
          # "Linux x86_64 SSE4.1 (mimalloc)") into a hyphenated artifact
          # name. upload-artifact@v7 technically allows spaces and parens
          # but a sanitized name keeps URLs and downloads clean.
          name: unit-results-${{ matrix.artifact_slug }}
          path: unit-results-*.xml

      - name: Run integration tests
        if: matrix.run_integration == true
        env:
          BWA_MEM3_TEST_MATRIX_ROW: ${{ matrix.name }}
        run: |
          ./test/bwa_mem3_tests_integration \
            --reporters=junit \
            --out=integration-results-${{ strategy.job-index }}.xml

      - name: Upload integration-test results
        if: always() && matrix.run_integration == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-results-${{ matrix.artifact_slug }}
          path: integration-results-*.xml

      - name: Verify mimalloc is linked (when enabled)
        if: matrix.use_mimalloc == '1'
        run: test/mimalloc_loaded_test.sh ./bwa-mem3

      - name: Verify mimalloc is NOT linked (when disabled)
        if: matrix.use_mimalloc == '0'
        run: |
          if test/mimalloc_loaded_test.sh ./bwa-mem3; then
            echo "FAIL: USE_MIMALLOC=0 build should NOT report mimalloc" >&2
            exit 1
          fi
          echo "PASS: no-mimalloc build correctly omits mimalloc"

      - name: Cache chr22 reference
        id: cache-chr22
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/chr22/chr22.fa
          key: chr22-hg38-ucsc-v1

      - name: Download chr22 reference (hg38)
        if: steps.cache-chr22.outputs.cache-hit != 'true'
        # --fail makes curl exit non-zero on HTTP 4xx/5xx instead of writing
        # the error body into the gunzip pipe; --retry/--retry-delay/
        # --retry-all-errors absorb transient UCSC hiccups so a flaky 5xx
        # doesn't fail the whole matrix on a cold cache. The SHA-256 pin
        # is enforced unconditionally by the next step so it catches both
        # a fresh download and a restored cache entry.
        run: |
          mkdir -p /tmp/chr22
          curl --fail --retry 3 --retry-delay 2 --retry-all-errors -sSL \
            "https://hgdownload.soe.ucsc.edu/goldenPath/hg38/chromosomes/chr22.fa.gz" \
            | gunzip > /tmp/chr22/chr22.fa
          test -s /tmp/chr22/chr22.fa
          echo "chr22.fa bytes: $(wc -c < /tmp/chr22/chr22.fa)"

      - name: Verify chr22 reference SHA-256
        # Runs unconditionally — after a cache restore (hit) and after a
        # fresh download (miss) — so the parity input is always
        # cryptographically validated against the pin. Without this, a
        # stale chr22-hg38-ucsc-v1 cache entry (e.g., one populated
        # before the pin existed, or one carried over from a future pin
        # bump that forgot to rev the cache key) would silently swap
        # every regression job to a different chr22 payload.
        env:
          CHR22_FASTA_SHA256_PIN: ce3ee1ca39356238f7aee438a40a88b4f1b9d80b316b263e16fb12402212d10f
        run: |
          actual_sha=$(shasum -a 256 /tmp/chr22/chr22.fa | awk '{print $1}')
          if [ "$actual_sha" != "$CHR22_FASTA_SHA256_PIN" ]; then
            echo "FAIL: chr22.fa sha256 mismatch (expected $CHR22_FASTA_SHA256_PIN, got $actual_sha)" >&2
            exit 1
          fi

      - name: Build chr22 FMI index
        # bwa-mem3 index is rebuilt every run because its sidecar layout is
        # coupled to the bwa-mem3 binary, which changes per commit.
        run: |
          cd /tmp/chr22
          "$GITHUB_WORKSPACE/bwa-mem3" index chr22.fa
          ls chr22.fa.*

      - name: Compute chr22 bwa-index cache inputs
        # Salt the bwa-index cache key with the inputs that actually
        # produce it: the bwa version (apt on Linux, brew on macOS) and a
        # digest of chr22.fa. Without this, an apt/brew bwa bump or a
        # UCSC reference refresh would silently restore stale sidecars
        # built from different inputs, breaking parity. shasum -a 256 is
        # available on both ubuntu-latest and macos-latest.
        run: |
          bwa_version=$(bwa 2>&1 | sed -n 's/^Version: //p' | head -1)
          chr22_fasta_sha=$(shasum -a 256 /tmp/chr22/chr22.fa | awk '{print $1}' | cut -c1-16)
          {
            echo "BWA_VERSION=${bwa_version}"
            echo "CHR22_FASTA_SHA=${chr22_fasta_sha}"
          } >> "$GITHUB_ENV"
          echo "BWA_VERSION=${bwa_version}"
          echo "CHR22_FASTA_SHA=${chr22_fasta_sha}"

      - name: Cache chr22 bwa indexes
        # Sidecars are cached separately from the chr22 FASTA so an
        # apt/brew bwa bump invalidates this key without re-downloading
        # the reference. The key is salted by ${BWA_VERSION} and a
        # ${CHR22_FASTA_SHA} digest of chr22.fa (exported above) plus
        # ${runner.os} to differentiate apt vs. brew bwa builds.
        id: cache-chr22-bwa
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /tmp/chr22/bwa_chr22.fa
            /tmp/chr22/bwa_chr22.fa.amb
            /tmp/chr22/bwa_chr22.fa.ann
            /tmp/chr22/bwa_chr22.fa.bwt
            /tmp/chr22/bwa_chr22.fa.pac
            /tmp/chr22/bwa_chr22.fa.sa
          key: chr22-hg38-ucsc-bwa-v2-${{ runner.os }}-${{ env.BWA_VERSION }}-${{ env.CHR22_FASTA_SHA }}

      - name: Build chr22 bwa indexes
        if: steps.cache-chr22-bwa.outputs.cache-hit != 'true'
        # bwa index writes sidecars next to the FASTA filename, so we use
        # a dedicated bwa_chr22.fa copy to keep its sidecars from
        # colliding with the bwa-mem3 index files at /tmp/chr22/chr22.fa.*.
        run: |
          cp /tmp/chr22/chr22.fa /tmp/chr22/bwa_chr22.fa
          bwa index /tmp/chr22/bwa_chr22.fa
          ls /tmp/chr22/bwa_chr22.fa.*

      - name: Setup holodeck (pixi)
        # Install holodeck via bioconda; pinned to v0.2.1 in
        # test/holodeck/pixi.toml. Runs on every matrix row. samtools is
        # bundled with holodeck in this pixi env so we have a uniform
        # source of `samtools faidx` across linux-64, linux-aarch64, and
        # osx-arm64 (the macOS brew step otherwise wouldn't carry it).
        uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          pixi-version: v0.49.0
          manifest-path: test/holodeck/pixi.toml
          cache: true

      - name: Index chr22 with samtools faidx
        # holodeck requires an indexed FASTA (.fai sidecar). The
        # bwa-mem3 indexer doesn't produce .fai, so build it here.
        # --frozen makes pixi error if pixi.lock is out of sync with
        # pixi.toml rather than silently regenerating the lockfile;
        # that pins samtools (manifest unbounded at >=1.20) and every
        # transitive dep to the committed lockfile for deterministic CI.
        run: |
          pixi run --frozen --manifest-path test/holodeck/pixi.toml -- \
            samtools faidx /tmp/chr22/chr22.fa

      - name: Simulate chr22 reads with holodeck
        # Deterministic ~50k PE pairs by construction: chr22 is ~50 Mbp
        # and --coverage 0.3 with --read-length 150 (~300 bp inserts)
        # yields ~50k pairs. --simple-names emits @holodeck::N headers
        # (aligners ignore name content). Flat 0.001 error rate mimics
        # dwgsim's -r 0.001 -S 2 to keep the byte-identical parity bar
        # realistic.
        run: |
          mkdir -p /tmp/chr22-sim
          pixi run --frozen --manifest-path test/holodeck/pixi.toml -- \
            holodeck simulate \
              -r /tmp/chr22/chr22.fa \
              -o /tmp/chr22-sim/reads \
              --coverage 0.3 \
              --read-length 150 \
              --seed 42 \
              --simple-names \
              --min-error-rate 0.001 --max-error-rate 0.001
          ls /tmp/chr22-sim/

      - name: Compare chr22 bwa vs bwa-mem3 (parity)
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          CHR22_FA=/tmp/chr22/chr22.fa \
          BWA_CHR22_FA=/tmp/chr22/bwa_chr22.fa \
          CHR22_SIM_DIR=/tmp/chr22-sim \
          bash test/regression/chr22_parity.sh

      - name: Long-read PE 8-bit/16-bit parity (chr22, 400bp)
        if: matrix.canonical == true
        # Exercises the recovered >=128bp 8-bit banded-SW path end-to-end: the
        # script self-simulates 400bp PE reads and diffs `bwa-mem3 mem` with the
        # 8-bit path enabled (default) vs BWAMEM3_DISABLE_BSW8=1 (forced 16-bit).
        # The two must be byte-identical -- guards the unsigned [0,255] recurrence
        # + routing gate against regression. Self-contained A/B (one binary).
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          CHR22_FA=/tmp/chr22/chr22.fa \
          CHR22_SIM_DIR=/tmp/chr22-sim-longread \
          PIXI_MANIFEST="$GITHUB_WORKSPACE/test/holodeck/pixi.toml" \
          bash test/regression/longread_pe_parity.sh

      - name: SIMD tier parity (avx2 vs avx512bw, chr22)
        if: matrix.canonical == true
        # One binary must emit byte-identical SAM whichever usable kernel tier it
        # dispatches. Scope is avx2/avx512bw: there is no batched kswv kernel
        # below AVX2 and forcing those tiers aborts the aligner (see the script
        # header). Cross-build parity is a different property, already covered by
        # chr22_parity.sh running on the sse41, avx2 and arm64 build jobs.
        #
        # On a runner without AVX-512BW there is only one sweepable tier and the
        # script reports SKIPPED, not PASS — so this step is a no-op there rather
        # than a false green. It still earns its place: the script had rotted
        # unrun to the point of aborting on its first tier, and this keeps that
        # from recurring silently.
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          PARITY_FA=/tmp/chr22/chr22.fa \
          PARITY_R1=/tmp/chr22-sim/reads.r1.fastq.gz \
          PARITY_R2=/tmp/chr22-sim/reads.r2.fastq.gz \
          bash test/regression/all_tiers_parity.sh

      - name: Run unit-test harness
        if: matrix.canonical == true || matrix.arch_flag == 'sse41'
        run: |
          bash test/run_unit_tests.sh

      - name: Makefile header-dependency check
        # Runs after the build because it inspects an already-built tree; on an
        # unbuilt one it would drag in the htslib configure first.
        #
        # MAKE_ARGS must carry the same flags this row built with, matching the
        # `Build bwa-mem3` step above: the wiring probe recompiles one object, and
        # recompiling it at different flags than libbwa.a was built with is the
        # hazard this check exists to catch. The empty-arch_flag branch is
        # unreachable while `canonical` sits on an avx2 row — it is kept so the
        # step keeps working if canonical ever moves to an ARM or single-binary
        # row, where an empty `arch=` would select a different build path.
        if: matrix.canonical == true
        run: |
          if [ "${{ matrix.arch_flag }}" = "" ]; then
            MAKE_ARGS="BASELINE_ARCH=${{ matrix.baseline_arch || 'avx2' }} CXX=${{ matrix.cxx || 'g++' }} USE_MIMALLOC=${{ matrix.use_mimalloc }}" \
              bash test/regression/make_header_deps.sh
          else
            MAKE_ARGS="arch=${{ matrix.arch_flag }} CXX=${{ matrix.cxx || 'g++' }} USE_MIMALLOC=${{ matrix.use_mimalloc }}" \
              bash test/regression/make_header_deps.sh
          fi

      - name: Makefile default-goal check
        # Also post-build, for the same reason as the step above. No arch= here:
        # the script sets it per case, since the goal is what it is checking.
        if: matrix.canonical == true
        run: |
          MAKE_ARGS="CXX=${{ matrix.cxx || 'g++' }} USE_MIMALLOC=${{ matrix.use_mimalloc }}" \
            bash test/regression/make_default_goal.sh

      - name: --bam=6 roundtrip smoke (chr22)
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          CHR22_FA=/tmp/chr22/chr22.fa \
          CHR22_SIM_DIR=/tmp/chr22-sim \
          bash test/regression/bam_roundtrip.sh

      - name: Thread-determinism smoke (chr22, -t 1 vs -t 4)
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          CHR22_FA=/tmp/chr22/chr22.fa \
          CHR22_SIM_DIR=/tmp/chr22-sim \
          bash test/regression/thread_determinism.sh

      - name: Chaining scratch is per-thread, not per-read
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          CHR22_FA=/tmp/chr22/chr22.fa \
          bash test/regression/chain_scratch_per_thread.sh

      - name: Cohort slicing does not change output
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          CHR22_FA=/tmp/chr22/chr22.fa \
          CHR22_SIM_DIR=/tmp/chr22-sim \
          bash test/regression/cohort_slice_identity.sh

      - name: Chunk cap stays opt-in (batching matches bwa-mem2 at every -t)
        if: matrix.canonical == true
        # bwa and bwa-mem2 both use an uncapped `chunk_size * n_threads` batch.
        # A default cap re-partitions the input, which changes each batch's
        # mem_pestat cohort and therefore the output, for every -t >= 26.
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          FIXTURES="$GITHUB_WORKSPACE/test/fixtures" \
          bash test/regression/chunk_cap_optin.sh

      - name: --supp-rep-hard-cap repetitive-seed regression
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          SUPP_REP_FIXTURE_AWK="$GITHUB_WORKSPACE/test/fixtures/supp_rep/build_fixture.awk" \
          SUPP_REP_PHIX_FA="$GITHUB_WORKSPACE/test/fixtures/phix.fa" \
          bash test/regression/supp_rep_hard_cap.sh

      - name: --compat byte-identical regression (phix)
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          COMPAT_PHIX_FA="$GITHUB_WORKSPACE/test/fixtures/phix.fa" \
          COMPAT_WORK_DIR=/tmp/compat-bytes \
          bash test/regression/compat_byte_identical.sh

      - name: header parity regression (AH:*, --compat @HD/@SQ)
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          HEADER_PARITY_WORK_DIR=/tmp/header-parity \
          bash test/regression/header_parity.sh

      - name: default @HD parity across output paths
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          HD_PARITY_PHIX_FA="$GITHUB_WORKSPACE/test/fixtures/phix.fa" \
          HD_PARITY_WORK_DIR=/tmp/hd-parity \
          bash test/regression/default_hd_parity.sh

      - name: SE alignment smoke (chr22)
        if: matrix.canonical == true
        run: |
          "$GITHUB_WORKSPACE/bwa-mem3" mem -t 4 /tmp/chr22/chr22.fa \
            /tmp/chr22-sim/reads.r1.fastq.gz > /tmp/chr22-sim/se.sam 2>/dev/null
          records=$(grep -cv '^@' /tmp/chr22-sim/se.sam)
          [ "$records" -gt 0 ] || { echo "FAIL: SE alignment produced zero records"; exit 1; }
          grep -q '^@PG.*bwa-mem3' /tmp/chr22-sim/se.sam || { echo "FAIL: SE missing @PG"; exit 1; }
          echo "PASS: SE smoke ($records records)"

      - name: Interleaved alignment smoke (chr22)
        if: matrix.canonical == true
        run: |
          # Interleave R1 and R2 into a single FASTQ at FASTQ-record (4-line)
          # granularity. The naive `paste R1 R2 | tr '\t' '\n'` interleaves at
          # line granularity, which produces a malformed FASTQ. Collapse each
          # input to one tab-separated row per record first (`paste - - - -`),
          # then interleave whole records, then re-expand tabs to newlines.
          paste -d '\n' \
            <(zcat /tmp/chr22-sim/reads.r1.fastq.gz | paste - - - -) \
            <(zcat /tmp/chr22-sim/reads.r2.fastq.gz | paste - - - -) \
            | tr '\t' '\n' > /tmp/chr22-sim/interleaved.fq
          "$GITHUB_WORKSPACE/bwa-mem3" mem -p -t 4 /tmp/chr22/chr22.fa \
            /tmp/chr22-sim/interleaved.fq > /tmp/chr22-sim/p.sam 2>/dev/null
          records=$(grep -cv '^@' /tmp/chr22-sim/p.sam)
          [ "$records" -gt 0 ] || { echo "FAIL: interleaved alignment produced zero records"; exit 1; }
          # ~50,000 simulated PE pairs × 2 reads = ~100,000 input reads, so a
          # properly interleaved input must produce at least one SAM line per
          # read (primary alignment, mapped or unmapped). Tolerate >= because
          # secondary/supplementary alignments add extra lines. Without this
          # floor the previous `paste | tr` (line-interleaved, malformed FASTQ)
          # silently passed at ~50k records — half the reads, parser-tolerated.
          [ "$records" -ge 100000 ] || { echo "FAIL: expected >=100000 records, got $records"; exit 1; }
          echo "PASS: interleaved smoke ($records records)"

      - name: Install bwa-meth pixi env
        if: matrix.canonical == true
        # The holodeck setup-pixi step already installed the pixi binary
        # to /home/runner/.pixi/bin and added it to PATH. Calling
        # setup-pixi a second time would collide on the binary download
        # ("Destination file path /home/runner/.pixi/bin/pixi already
        # exists"). Resolve the bwa-meth project's deps directly using
        # the already-installed pixi instead.
        run: |
          pixi install --manifest-path test/meth/pyproject.toml

      - name: Checkout bwa-meth oracle
        if: matrix.canonical == true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Most important of the four: this is a THIRD-PARTY tree, and the
          # steps below copy fixtures out of it and run test/regression scripts
          # against it. Persisting this repository's token inside a foreign
          # checkout's .git/config has no use here at all.
          persist-credentials: false
          repository: brentp/bwa-meth
          path: bwa-meth-oracle

      - name: Copy bwa-meth fixtures into test/meth/
        if: matrix.canonical == true
        run: |
          cp bwa-meth-oracle/example/ref.fa test/meth/
          cp bwa-meth-oracle/example/t_R1.fastq.gz test/meth/
          cp bwa-meth-oracle/example/t_R2.fastq.gz test/meth/
          ls -la test/meth/

      - name: Run --meth Layers 1-3
        if: matrix.canonical == true
        env:
          BWAMETH_DIR: ${{ github.workspace }}/bwa-meth-oracle
        run: bash test/regression/meth_oracle.sh

      - name: --meth whole-aligner regressions (D3)
        if: matrix.canonical == true
        # Self-contained --meth regressions (each generates its fixtures inline):
        # dual index + seed->original remap; mixed OT/OB PE per-hypothesis scoring;
        # OT/OB x strand placement; original-alphabet output integrity (Bismark
        # four-strand XR/XG); and the reverse-strand-conversion matrix flip
        # (meth_strand_hyp) — a reverse read that is unmapped under the unflipped
        # matrix and full-length under the fix.
        env:
          BWA_MEM3: ${{ github.workspace }}/bwa-mem3
        run: |
          for t in meth_seed_index meth_mixed_pe_asym meth_pe_placement \
                   meth_output_integrity meth_reverse_strand_conversion \
                   meth_seed_unpacked_ref_not_loaded; do
            echo "::group::$t"; bash "test/regression/$t.sh"; echo "::endgroup::"
          done

      - name: Short-read SE smoke (chr22, ASAN, dense+variable-length)
        if: matrix.canonical == true
        # Guards the wsize_mem byte-vs-entry capacity-tracker class of bug
        # fixed in PR #100. The fixture simulates 25-50 bp variable-length
        # reads from chr22:14M-20M (pericentromeric, repeat-rich) at 5-10%
        # error so SMEM density per base exceeds tot_len bytes across
        # successive batches with mismatched byte totals — exactly the
        # regime that inverts the `if (tot_len >= wsize_mem)` gate.
        # Builds with ASAN=1 (forces USE_MIMALLOC=0; mimalloc and asan
        # can't coexist) so the heap-buffer-overflow in mem_collect_smem
        # surfaces as a non-zero exit independent of allocator behavior.
        # Placed last in the canonical row because `make clean && make
        # ASAN=1` replaces $GITHUB_WORKSPACE/bwa-mem3; nothing after this
        # step uses the binary. Canonical-only because PR #100 confirmed
        # the bug is input-regime-specific, not codegen-/SIMD-specific
        # (reproduces on AVX2, AVX-512BW, SMEM_LOCKSTEP_N=1).
        run: |
          make clean
          make -j"$(nproc)" arch=${{ matrix.arch_flag }} \
            CXX=${{ matrix.cxx || 'g++' }} ASAN=1
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          CHR22_FA=/tmp/chr22/chr22.fa \
          CHR22_SIM_DIR=/tmp/chr22-sim-dense \
          PIXI_MANIFEST="$GITHUB_WORKSPACE/test/holodeck/pixi.toml" \
          bash test/regression/short_read_smoke.sh
          # Re-run the header regression against the SAME asan binary. The
          # header writers size buffers from header text, and a one-byte
          # overrun there changes no output byte, so the non-asan run of this
          # script earlier in the row cannot see it -- only asan can. Cheap
          # (it builds its own 3-contig ALT fixture) and it needs the samtools
          # apt package this row already installs for `samtools dict`.
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          HEADER_PARITY_WORK_DIR=/tmp/header-parity-asan \
          bash test/regression/header_parity.sh

  coverage:
    name: Coverage (Linux AVX2, gcov → Codecov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: zlib1g-dev libdeflate-dev autoconf automake gcovr
          version: 1.0

      - name: Build libbwa.a with coverage
        run: make -j"$(nproc)" arch=avx2 CXX=g++ USE_MIMALLOC=0 COVERAGE=1

      - name: Build test binaries with coverage
        # Go through the parent test-binaries target so ARCH_FLAGS_FROM_PARENT
        # propagates and the test TU sees the same __AVX2__ / __AVX512BW__
        # surface libbwa.a was compiled with. COVERAGE=1 still flows in via
        # MAKEFLAGS.
        run: make test-binaries arch=avx2 CXX=g++ COVERAGE=1

      - name: Run unit tests
        run: ./test/bwa_mem3_tests_unit

      - name: Run integration tests
        run: ./test/bwa_mem3_tests_integration

      - name: Collect coverage into Cobertura XML
        # gcovr walks the tree, runs gcov on each .gcda, and emits a
        # single Cobertura XML that Codecov can consume directly. Limit
        # to src/ and test/ (skip vendored htslib / mimalloc / etc.).
        # `--filter` patterns are regular expressions matched against
        # paths relative to `--root` and are NOT implicitly anchored, so
        # prefix each with `^` to scope them to the project root and
        # cleanly exclude anything under ext/ that happens to share a
        # subpath (e.g. ext/htslib/test/).
        run: |
          gcovr --root . \
                --filter '^src/' --filter '^test/framework/' \
                --filter '^test/unit/' --filter '^test/integration/' \
                --print-summary \
                --xml coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true

  # Profiling (--profile) is compiled out of the default build, so the matrix
  # rows above never exercise the STAGE_PROF=1 code path. Build it here (and run
  # the stage_prof unit test) so the opt-in path cannot silently bit-rot.
  profiling-build:
    name: Profiling build (STAGE_PROF=1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install dependencies (Linux)
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: zlib1g-dev libdeflate-dev autoconf automake libomp-dev
          version: 1.1

      - name: Build with profiling compiled in
        run: make -j"$(nproc)" STAGE_PROF=1 BASELINE_ARCH=avx2 CXX=g++ USE_MIMALLOC=1

      - name: --profile is exposed in this build
        run: |
          ./bwa-mem3 mem 2>&1 | grep -q -- '--profile' \
            || { echo "::error::--profile missing from a STAGE_PROF=1 build"; exit 1; }

      - name: stage_prof unit test
        run: make stage_prof_test && ./stage_prof_test

      - name: Partial cohort slices report their compute CPU
        # Only a STAGE_PROF build can run this, which is why it lives here and
        # not in the matrix rows above. Cohort slicing gives step 1 an early
        # exit; if that exit forgets to harvest g_ktfor, the slice's compute CPU
        # is destroyed rather than merely unreported, and --profile under-counts
        # in proportion to how much slicing is happening.
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          FIXTURES="$GITHUB_WORKSPACE/test/fixtures" \
          bash test/regression/profile_slice_cpu.sh
