name: proto-neon-kswv

# Correctness + perf harness for the kswv batched mate-rescue port. Runs on
# proto/* branches and PRs to main.
#
# Job graph (fan-out / fan-in):
#
#   prepare ──┬─→ run-mem-arm-port ─┐
#             ├─→ run-mem-arm-ctrl ─┤
#             ├─→ run-mem-x86-port ─┼── report
#             └─→ run-mem-x86-ctrl ─┘
#
#   kswv-arm     (unit kswv test + ASan zero-rows test, off the critical path)
#   kswv-x86     (unit kswv test + ASan zero-rows test, off the critical path)
#
# Stages:
#   prepare        — install holodeck, fetch chr17, simulate reads. The ref
#                    and reads are cached across runs; reads are also
#                    uploaded as a small artifact so downstream jobs do not
#                    need the holodeck binary themselves.
#   run-mem-*      — build bwa-mem3 (ccache + full-binary cache), restore
#                    the chr17 FM-index (or build it on miss), run mem
#                    N_REPS times with BAM-1 output, upload timings + (port
#                    only) BAM.
#   report         — fan-in: render port-vs-control perf tables per arch
#                    and md5 the port BAM body across arches for SAM
#                    identity.
#   kswv-*         — independent unit tests (doctest framework, suite
#                    "unit/kswv") + ASan zero-rows regression; share the
#                    per-arch ccache so libbwa rebuilds (incl. the ASan
#                    rebuild) are cheap.
#
# Port-vs-control timings come from different runners under this design,
# so the speedup signal carries some inter-runner variance on top of the
# usual rep-to-rep noise. Median of N_REPS=3 holds this within a few
# percent in practice; bump N_REPS if a particular comparison looks flaky.

on:
  push:
    branches:
      - 'proto/neon-kswv-**'
      - 'proto/avx2-kswv-**'
      - 'proto/avx512-kswv-**'
  pull_request:
    branches:
      - 'main'
      - 'proto/neon-kswv-**'
    paths:
      - 'src/**'
      - 'test/kswv_nrow_zero_test.cpp'
      - 'test/framework/**'
      - 'test/unit/**'
      - 'test/Makefile'
      - '.github/workflows/proto-neon-kswv.yml'
      - 'Makefile'
  workflow_dispatch:

env:
  CHR17_URL: "https://hgdownload.soe.ucsc.edu/goldenpath/hg38/chromosomes/chr17.fa.gz"
  CHR17_SHA256: "9acaede8d9b0a190489b49ebf38063bc69897c0d5f125c7549a6f7ee91a0b3c0"  # UCSC hg38 chr17.fa.gz
  HOLODECK_VERSION: "0.2.0"
  SIM_COVERAGE: "1"           # ~415K PE pairs on chr17 at read-length 100
  SIM_READ_LENGTH: "100"
  SIM_SEED: "42"
  N_REPS: "3"

# Only the two jobs that check out source (run-mem, kswv) consume the token at
# all, and `contents: read` is all actions/checkout needs. prepare and report
# check nothing out -- they install tools, generate data, and move artifacts --
# and their cache/artifact traffic authenticates with ACTIONS_RUNTIME_TOKEN,
# independently of this block. Declared once at the workflow level rather than
# `{}` on those two: the tighter form buys nothing over `contents: read` on a
# public repo, and one block is what ci.yml does.
permissions:
  contents: read

jobs:
  prepare:
    name: prepare (holodeck + chr17 + reads)
    runs-on: ubuntu-24.04
    # ~3 min warm; a cold cache installs holodeck via cargo and simulates reads.
    timeout-minutes: 20
    steps:
      - name: Install apt dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends curl ca-certificates samtools

      - name: Cache holodeck binary
        id: cache-holodeck
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/holodeck
          key: holodeck-${{ runner.arch }}-${{ env.HOLODECK_VERSION }}

      - name: Install holodeck via cargo
        if: steps.cache-holodeck.outputs.cache-hit != 'true'
        run: |
          # ubuntu-24.04 ships rustup; ensure stable >= 1.94 (holodeck MSRV).
          # `-q` is no longer accepted on `toolchain install` by recent rustup
          # parsers; pass it as a top-level flag instead.
          rustup -q toolchain install stable --profile minimal
          rustup default stable
          cargo install --locked --version "$HOLODECK_VERSION" holodeck

      - name: Add cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache chr17 reference
        id: cache-chr17
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/ci-data/chr17.fa
          key: chr17-${{ env.CHR17_SHA256 }}

      - name: Download chr17 if cache miss
        if: steps.cache-chr17.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/ci-data
          curl -sL "$CHR17_URL" -o /tmp/ci-data/chr17.fa.gz
          got_sha256="$(sha256sum /tmp/ci-data/chr17.fa.gz | awk '{print $1}')"
          if [ "$got_sha256" != "$CHR17_SHA256" ]; then
            echo "chr17.fa.gz sha256 mismatch: expected $CHR17_SHA256, got $got_sha256"
            exit 1
          fi
          gunzip /tmp/ci-data/chr17.fa.gz

      - name: Cache simulated reads (r1)
        id: cache-reads-r1
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/ci-data/reads.r1.fastq.gz
          key: reads-holodeck-${{ env.HOLODECK_VERSION }}-${{ env.CHR17_SHA256 }}-cov${{ env.SIM_COVERAGE }}-l${{ env.SIM_READ_LENGTH }}-seed${{ env.SIM_SEED }}-r1

      - name: Cache simulated reads (r2)
        id: cache-reads-r2
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/ci-data/reads.r2.fastq.gz
          key: reads-holodeck-${{ env.HOLODECK_VERSION }}-${{ env.CHR17_SHA256 }}-cov${{ env.SIM_COVERAGE }}-l${{ env.SIM_READ_LENGTH }}-seed${{ env.SIM_SEED }}-r2

      - name: Index chr17 for holodeck (.fai)
        if: steps.cache-reads-r1.outputs.cache-hit != 'true' || steps.cache-reads-r2.outputs.cache-hit != 'true'
        run: samtools faidx /tmp/ci-data/chr17.fa

      - name: Simulate reads with holodeck
        if: steps.cache-reads-r1.outputs.cache-hit != 'true' || steps.cache-reads-r2.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/ci-data
          holodeck simulate \
            -r /tmp/ci-data/chr17.fa \
            -o /tmp/ci-data/reads \
            --coverage "$SIM_COVERAGE" \
            --read-length "$SIM_READ_LENGTH" \
            --seed "$SIM_SEED" \
            -t 2

      - name: Upload data artifact (reads + ref)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Bundles ref + reads so run-mem jobs depend on a single artifact
          # instead of also restoring the chr17 cache. The cache still helps
          # this prepare job skip the curl+gunzip on subsequent runs.
          name: data
          path: |
            /tmp/ci-data/chr17.fa
            /tmp/ci-data/reads.r1.fastq.gz
            /tmp/ci-data/reads.r2.fastq.gz
          if-no-files-found: error
          retention-days: 1

  run-mem:
    name: ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.runs-on }}
    # Build bwa-mem3 (cold: full clang-19 build) plus index and N_REPS mem runs.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "run-mem-arm-port"
            runs-on: ubuntu-24.04-arm
            arch: arm
            build_flags: ""
            binary_name: bwa-mem3.arm64
            flags_slug: port
          - label: "run-mem-arm-ctrl"
            runs-on: ubuntu-24.04-arm
            arch: arm
            build_flags: "DISABLE_BATCHED_MATESW=1"
            binary_name: bwa-mem3.arm64
            flags_slug: control
          - label: "run-mem-x86-port"
            runs-on: ubuntu-24.04
            arch: x86
            build_flags: ""
            binary_name: bwa-mem3  # x86 multi-arch dispatcher binary
            flags_slug: port
          - label: "run-mem-x86-ctrl"
            runs-on: ubuntu-24.04
            arch: x86
            build_flags: "DISABLE_BATCHED_MATESW=1"
            binary_name: bwa-mem3
            flags_slug: control
    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: "500M"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install apt dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y zlib1g-dev libdeflate-dev samtools libomp-dev ccache
          # clang-19 (the shipping/benchmarked compiler) from apt.llvm.org so the
          # perf harness builds representatively; libomp-19-dev provides omp.h for
          # clang's -fopenmp. Matches the compiler floor added in the parent PR.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh && chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 19 && sudo apt-get install -y libomp-19-dev
          clang++-19 --version | head -1

      - name: Detect x86 ISA (avx2 / avx512bw)
        if: matrix.arch == 'x86'
        run: |
          # AVX-512BW is required for the x86 batched mate-rescue path (gated
          # by __AVX512BW__ in bwamem.cpp:1255 and bwamem_pair.cpp:657). Free
          # GH runners typically do not expose it. When it is missing we fall
          # back to AVX2, which takes the same scalar mem_sam_pe path as ARM
          # — so the cross-arch SAM identity check is then testing
          # scalar-vs-scalar, not batched-vs-scalar.
          if grep -q avx512bw /proc/cpuinfo; then
            echo "MAKE_ARCH=avx512bw" >> "$GITHUB_ENV"
          else
            echo "::warning::AVX-512BW not available on this runner; falling back to AVX2"
            echo "MAKE_ARCH=avx2" >> "$GITHUB_ENV"
          fi

      - name: Set arm make arch
        if: matrix.arch == 'arm'
        run: echo "MAKE_ARCH=arm64" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          # Per-arch ccache. Build flags don't need to participate because
          # ccache hashes preprocessor defines (e.g. -DDISABLE_BATCHED_MATESW)
          # via CXXFLAGS. Restore from any prior arch ccache entry.
          key: ccache-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-

      - name: Cache prebuilt bwa-mem3 binary
        id: cache-binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.binary_name }}
          # Exact-hit only (no restore-keys): a binary from a different SHA
          # would not match the source we just checked out. ccache covers
          # the cold-build case when this misses.
          key: bwa-mem3-${{ runner.arch }}-${{ matrix.flags_slug }}-${{ env.MAKE_ARCH }}-${{ github.sha }}

      - name: Build bwa-mem3 (ccache wrapping clang-19)
        if: steps.cache-binary.outputs.cache-hit != 'true'
        run: |
          # Pair CC with CXX explicitly: the Makefile only auto-pairs bare
          # compiler names (g++, clang++), not wrapped invocations like
          # `ccache g++` — see Makefile lines 36–58.
          # Pass the `arm64` target explicitly on ARM rather than relying on
          # the implicit `myall:arm64` default-goal dispatch (set up
          # conditionally in the Makefile based on $(IS_ARM) + empty $(arch)).
          # Makes the produced artifact name (bwa-mem3.arm64) unambiguous.
          ccache --zero-stats >/dev/null
          if [ "${{ matrix.arch }}" = "arm" ]; then
            make -j"$(nproc)" CXX="ccache clang++-19" CC="ccache clang-19" ${{ matrix.build_flags }} arm64
          else
            make -j"$(nproc)" arch="$MAKE_ARCH" CXX="ccache clang++-19" CC="ccache clang-19" ${{ matrix.build_flags }}
          fi
          ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify binary
        run: ls -l ./${{ matrix.binary_name }}

      - name: Download data artifact (ref + reads)
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: data
          path: /tmp/ci-data

      - name: Cache chr17 bwa-mem3 index
        id: cache-chr17-index
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /tmp/ci-data/chr17.fa.0123
            /tmp/ci-data/chr17.fa.amb
            /tmp/ci-data/chr17.fa.ann
            /tmp/ci-data/chr17.fa.bwt.2bit.64
            /tmp/ci-data/chr17.fa.pac
          # Index format is arch-portable; share one cache across arm and x86.
          key: chr17-bwamem2-index-${{ env.CHR17_SHA256 }}

      - name: Build chr17 index if cache miss
        if: steps.cache-chr17-index.outputs.cache-hit != 'true'
        run: ./${{ matrix.binary_name }} index /tmp/ci-data/chr17.fa

      - name: Run mem (BAM-1 output)
        run: |
          set -o pipefail
          mkdir -p /tmp/ci-out
          for rep in $(seq 1 "$N_REPS"); do
            base="/tmp/ci-out/${{ matrix.flags_slug }}.rep${rep}"
            /usr/bin/time -v ./${{ matrix.binary_name }} mem -t "$(nproc)" \
              /tmp/ci-data/chr17.fa \
              /tmp/ci-data/reads.r1.fastq.gz /tmp/ci-data/reads.r2.fastq.gz \
              2> "${base}.time" \
              | samtools view -@ 2 -b -1 -o "${base}.bam" -
          done

      - name: Upload timings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-${{ matrix.arch }}-${{ matrix.flags_slug }}-time
          path: /tmp/ci-out/${{ matrix.flags_slug }}.rep*.time
          if-no-files-found: error
          retention-days: 1

      - name: Upload port BAM (rep1) for cross-arch identity check
        if: matrix.flags_slug == 'port'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-${{ matrix.arch }}-port-bam
          path: /tmp/ci-out/port.rep1.bam
          if-no-files-found: error
          retention-days: 1

  report:
    name: report (perf table + cross-arch SAM identity)
    needs: run-mem
    runs-on: ubuntu-24.04
    # Downloads artifacts, renders tables, and md5s two sorted BAMs; quick.
    timeout-minutes: 10
    steps:
      - name: Install apt dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends samtools

      - name: Download all run-mem results
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: /tmp/results
          pattern: results-*

      - name: Render perf tables
        run: |
          extract_elapsed() {
            awk '/Elapsed \(wall clock\) time/ { split($NF, t, ":"); if (length(t)==3) print t[1]*3600+t[2]*60+t[3]; else print t[1]*60+t[2] }' "$1"
          }
          # Generalized median: works for any N_REPS (odd or even). The
          # header comment encourages bumping N_REPS for noisy comparisons,
          # so this helper must not assume N=3. Picks the middle element
          # (index = (N+1)/2, integer-truncated) of the sorted samples,
          # i.e. the lower middle for even N — same convention as N=3.
          median() {
            sort -n "$1" | awk '
              { a[NR] = $1 }
              END {
                if (NR == 0) exit 1
                print a[int((NR + 1) / 2)]
              }
            '
          }

          report_arch() {
            arch="$1"
            port_dir="/tmp/results/results-${arch}-port-time"
            ctrl_dir="/tmp/results/results-${arch}-control-time"
            port_elapsed="/tmp/${arch}.port.elapsed"
            ctrl_elapsed="/tmp/${arch}.ctrl.elapsed"
            [ -d "$port_dir" ] && [ -d "$ctrl_dir" ] || { echo "missing $arch results"; return 1; }
            echo "## ${arch} perf A/B (port vs control, DISABLE_BATCHED_MATESW)"
            echo ""
            echo "| rep | port (s) | control (s) |"
            echo "| --- | --------:| -----------:|"
            : > "$port_elapsed"
            : > "$ctrl_elapsed"
            for rep in $(seq 1 "$N_REPS"); do
              p=$(extract_elapsed "${port_dir}/port.rep${rep}.time")
              c=$(extract_elapsed "${ctrl_dir}/control.rep${rep}.time")
              echo "| $rep | $p | $c |"
              echo "$p" >> "$port_elapsed"
              echo "$c" >> "$ctrl_elapsed"
            done
            pm=$(median "$port_elapsed")
            cm=$(median "$ctrl_elapsed")
            echo ""
            echo "median port: ${pm}s, median control: ${cm}s"
            if [ -n "$pm" ] && [ -n "$cm" ] && [ "$pm" != "0" ]; then
              speedup=$(awk -v p="$pm" -v c="$cm" 'BEGIN { printf "%.2f", c/p }')
              pct=$(awk -v p="$pm" -v c="$cm" 'BEGIN { printf "%+.1f%%", 100*(c-p)/c }')
              echo "speedup (control / port): ${speedup}x  (${pct})"
            fi
            echo ""
          }

          { report_arch arm; report_arch x86; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cross-arch SAM identity (port-arm vs port-x86)
        run: |
          arm_bam=/tmp/results/results-arm-port-bam/port.rep1.bam
          x86_bam=/tmp/results/results-x86-port-bam/port.rep1.bam
          for f in "$arm_bam" "$x86_bam"; do
            [ -s "$f" ] || { echo "missing $f"; exit 1; }
          done
          # Sort by name to canonicalize multi-thread output order, then md5
          # the records body (samtools view drops headers by default, which
          # avoids @PG/@HD differences across builds).
          samtools sort -n -@ "$(nproc)" -o /tmp/arm.sorted.bam "$arm_bam"
          samtools sort -n -@ "$(nproc)" -o /tmp/x86.sorted.bam "$x86_bam"
          arm_md5=$(samtools view /tmp/arm.sorted.bam | md5sum | awk '{print $1}')
          x86_md5=$(samtools view /tmp/x86.sorted.bam | md5sum | awk '{print $1}')
          {
            echo "## Cross-arch SAM identity"
            echo ""
            echo "- ARM (port, NEON batched mate-rescue): \`$arm_md5\`"
            echo "- x86 (port, batched on AVX-512BW / scalar on AVX2): \`$x86_md5\`"
            echo ""
            if [ "$arm_md5" = "$x86_md5" ]; then
              echo "PASS: byte-identical sorted SAM body across arches."
            else
              echo "FAIL: SAM md5 differs."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$arm_md5" = "$x86_md5" ] || exit 1

  kswv:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runs-on }}
    # Unit-test tier sweep plus two `make clean` ASan rebuilds; ~4-6 min normally.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "kswv-arm"
            runs-on: ubuntu-24.04-arm
            arch: arm
          - label: "kswv-x86"
            runs-on: ubuntu-24.04
            arch: x86
    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: "500M"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install apt dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y zlib1g-dev libdeflate-dev libomp-dev ccache
          # clang-19 from apt.llvm.org (shipping compiler + floor minimum);
          # libomp-19-dev provides omp.h for clang's -fopenmp.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh && chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 19 && sudo apt-get install -y libomp-19-dev
          clang++-19 --version | head -1

      - name: Detect x86 ISA
        if: matrix.arch == 'x86'
        run: |
          if grep -q avx512bw /proc/cpuinfo; then
            echo "MAKE_ARCH=avx512bw" >> "$GITHUB_ENV"
          else
            echo "MAKE_ARCH=avx2" >> "$GITHUB_ENV"
          fi

      - name: Set arm make arch
        if: matrix.arch == 'arm'
        run: echo "MAKE_ARCH=arm64" >> "$GITHUB_ENV"

      # Fingerprint what `-march=native` actually resolves to on THIS runner.
      #
      # Several targets in this job compile src/kswv.cpp and src/bandedSWA.cpp
      # at -march=native (Makefile: src/kswv.native.o, src/bandedSWA.native.o,
      # consumed by kswv_nrow_zero_test, kswv_freed_cell_test,
      # bandedswa_padding_test, bandedswa_highzdrop_seed_test and
      # bandedswa_high_h0_zdrop_test). ccache hashes the literal command line
      # and the compiler binary -- NOT the host CPU -- so on two runners with
      # the same gcc the string "-march=native" hashes identically while the
      # emitted code does not. A newer-microarch object then gets served to an
      # older-microarch runner and the test dies with SIGILL (exit 132) before
      # its first assertion.
      #
      # MAKE_ARCH alone does not separate them: it has three values
      # (avx2 / avx512bw / arm64) while -march=native encodes the exact
      # microarch, so Ice Lake, Sapphire Rapids and Granite Rapids all share
      # the avx512bw bucket and collide. Observed on PR #290 -- a
      # bandedSWA.native.o built by the previous run SIGILL'd on the next one.
      #
      # `-Q --help=target` prints the target options AS RESOLVED for the
      # selected -march, so it is the authoritative answer to "what will the
      # compiler emit here", and it tracks the compiler version too.
      - name: Fingerprint native ISA
        run: |
          set -euo pipefail
          # Preferred source: the resolved target options themselves.
          if dump=$(g++ -march=native -Q --help=target 2>/dev/null) && [ -n "$dump" ]; then
            src="gcc -Q --help=target"
          else
            # Coarser, but still varies with both host CPU and compiler. Only
            # here so an environment where -Q --help=target is unavailable
            # degrades the key's precision instead of failing the whole job.
            dump=$(g++ -v 2>&1; grep -E '^(model name|flags|Features)' /proc/cpuinfo | sort -u)
            src="compiler version + cpuinfo (fallback)"
          fi
          # A constant hash would silently re-merge every microarch into one
          # bucket -- the exact bug this guards -- so refuse to emit one.
          if [ -z "$dump" ]; then
            echo "::error::could not fingerprint the native ISA"
            exit 1
          fi
          echo "fingerprint source: $src"
          printf '%s\n' "$dump" > /tmp/native-isa.txt
          isa=$(sha256sum < /tmp/native-isa.txt | cut -c1-16)
          echo "NATIVE_ISA=$isa" >> "$GITHUB_ENV"
          # Belt and braces: feed the same dump into ccache's own hash, so a
          # false hit is impossible even if two microarchs ever do land in one
          # cache entry (e.g. a future job that forgets the key component).
          echo "CCACHE_EXTRAFILES=/tmp/native-isa.txt" >> "$GITHUB_ENV"
          # Breadcrumbs for triaging a future SIGILL.
          echo "native ISA fingerprint: $isa"
          grep -m1 'model name' /proc/cpuinfo || true

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          # Partitioned by NATIVE_ISA -- the hash of what `-march=native`
          # resolves to on this runner (see "Fingerprint native ISA" above for
          # why, and for the SIGILL it prevents). MAKE_ARCH stays in the key so
          # the entries remain readable at a glance, but NATIVE_ISA is the part
          # that makes them correct: it is strictly finer, since every
          # avx512bw-class microarch shares one MAKE_ARCH value.
          #
          # Both key and restore-keys carry it. A restore-key prefix that
          # stopped at MAKE_ARCH would re-admit exactly the cross-microarch
          # match this is meant to exclude, which is how the original bug
          # survived an earlier attempt to fix it.
          #
          # This drops the historical sharing with run-mem-${arch} jobs, which
          # is fine -- run-mem-x86 builds with explicit -m flags tied to
          # MAKE_ARCH, never -march=native, so it has no such hazard.
          key: ccache-${{ runner.arch }}-${{ env.MAKE_ARCH }}-n${{ env.NATIVE_ISA }}-kswv-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-${{ env.MAKE_ARCH }}-n${{ env.NATIVE_ISA }}-

      - name: Build + run kswv unit test (all host-reachable SIMD tiers)
        # Builds the doctest-based test/bwa_mem3_tests_unit binary via the
        # parent `test-binaries` target so ARCH_FLAGS_FROM_PARENT plumbing
        # propagates and the test TU sees the same __AVX2__ / __AVX512BW__
        # / NEON surface libbwa was built with.
        #
        # bwa-mem3 itself is built too, purely as the tier oracle: its version
        # banner is the only thing that reliably reports which tier a given
        # BWAMEM3_FORCE_TIER actually selected (an unreachable request is
        # ignored, not refused). Incremental on top of libbwa.a -- one compile
        # and a link. See .github/scripts/kswv-tier-sweep.sh for the rest.
        #
        # Sweeping matters because a single run only ever exercises ONE tier,
        # and which one was decided by whichever runner we landed on. The
        # kernels differ per tier by construction, and avx512bw is one of the
        # two that carried the #290 padding bug.
        run: |
          mkdir -p /tmp/ci-out
          ccache --zero-stats >/dev/null
          make arch="$MAKE_ARCH" CXX="ccache clang++-19" CC="ccache clang-19" test-binaries
          make arch="$MAKE_ARCH" CXX="ccache clang++-19" CC="ccache clang-19" bwa-mem3
          BWA_MEM3=./bwa-mem3 \
          TEST_BIN=./test/bwa_mem3_tests_unit \
          OUT_DIR=/tmp/ci-out \
          ARCH_LABEL=${{ matrix.arch }} \
            bash .github/scripts/kswv-tier-sweep.sh

      - name: Upload kswv unit test JUnit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kswv-unit-${{ matrix.arch }}
          # One XML per tier that ran (kswv-unit-<arch>-<tier>.xml), so the
          # artifact set itself records which tiers were covered.
          path: /tmp/ci-out/kswv-unit-${{ matrix.arch }}-*.xml
          if-no-files-found: warn
          retention-days: 1

      - name: Build + run kswv_nrow_zero_test (ASan)
        # issue 38 / upstream PR 289: all-len1==0 batches used to walk past
        # the rowMax allocation prefix. Rebuild libbwa under asan so the
        # pre-fix write trips heap-buffer-overflow rather than corrupting
        # silently. `make clean` forces full recompile under instrumentation.
        run: |
          make clean
          make ASAN=1 arch="$MAKE_ARCH" CXX="ccache clang++-19" CC="ccache clang-19" kswv_nrow_zero_test
          ./kswv_nrow_zero_test
          ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build + run bandedswa_padding_test (ASan)
        # issue 146: getScores8/16 prefetch-read pairArray[i+j+PFD] past a
        # caller's minimal roundup(numPairs, SIMD_WIDTH) allocation. Under ASan
        # a tight-allocation caller trips heap-buffer-overflow; the bounded
        # prefetch runs clean. `make clean` forces full recompile under asan.
        run: |
          make clean
          make ASAN=1 arch="$MAKE_ARCH" CXX="ccache clang++-19" CC="ccache clang-19" bandedswa_padding_test
          ./bandedswa_padding_test
          ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
