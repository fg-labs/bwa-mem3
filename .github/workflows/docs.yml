name: docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/docs.yml'
      - '.readthedocs.yaml'
  push:
    branches: [main]

# The single job builds mdbook and drift-checks the generated CLI snippets. Its
# only git operation is a local `git diff --exit-code docs/_generated/`, which
# needs no auth; cache and artifact traffic authenticates with
# ACTIONS_RUNTIME_TOKEN, independently of this block. So `contents: read` (what
# actions/checkout needs, and nothing more) is the whole requirement, declared
# once at the workflow level as in ci.yml.
permissions:
  contents: read

jobs:
  build:
    name: build mdbook + drift check CLI snippets
    runs-on: ubuntu-24.04
    # Builds bwa-mem3 only to dump CLI help for the docs (compiler-agnostic), so
    # it opts out of the compiler floor and uses the runner's default compiler.
    env:
      ALLOW_UNSUPPORTED_COMPILER: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install build deps for bwa-mem3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake zlib1g-dev libdeflate-dev libbz2-dev liblzma-dev libcurl4-openssl-dev libssl-dev

      - name: Cache cargo bin (mdbook + plugins)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-mermaid
            ~/.cargo/bin/mdbook-linkcheck2
          key: cargo-mdbook-0.5.2-mermaid-0.17.0-linkcheck2-0.12.2-${{ runner.os }}-v1

      - name: Install mdbook + plugins
        run: |
          want_mdbook=0.5.2
          want_mermaid=0.17.0
          want_linkcheck2=0.12.2
          # mdbook prints "mdbook v0.5.2" (note the leading 'v'); strip it so the
          # comparison against want_mdbook matches and the install does not rerun
          # every time. mdbook-mermaid and mdbook-linkcheck2 emit plain versions.
          have_mdbook="$(mdbook --version 2>/dev/null | awk '{print $2}' | sed 's/^v//' || true)"
          have_mermaid="$(mdbook-mermaid --version 2>/dev/null | awk '{print $2}' || true)"
          have_linkcheck2="$(mdbook-linkcheck2 --version 2>/dev/null | awk '{print $2}' || true)"
          if [ "$have_mdbook" != "$want_mdbook" ]; then
            cargo install mdbook --version "$want_mdbook" --locked --force
          fi
          if [ "$have_mermaid" != "$want_mermaid" ]; then
            cargo install mdbook-mermaid --version "$want_mermaid" --locked --force
          fi
          # Broken-link checker backend (see docs/book.toml). The fork supports
          # mdBook 0.5; the original mdbook-linkcheck does not.
          if [ "$have_linkcheck2" != "$want_linkcheck2" ]; then
            cargo install mdbook-linkcheck2 --version "$want_linkcheck2" --locked --force
          fi
          mdbook --version
          mdbook-mermaid --version
          mdbook-linkcheck2 --version

      - name: Build bwa-mem3
        run: make

      - name: Regenerate CLI snippets
        run: make docs-cli

      - name: Drift check (CLI snippets)
        run: |
          if ! git diff --exit-code docs/_generated/; then
            echo "::error::docs/_generated/cli/*.txt is out of sync. Run 'make docs-cli' locally and commit."
            exit 1
          fi

      - name: Build mdbook
        run: make docs
