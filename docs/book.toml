[book]
title = "bwa-mem3"
description = "Accelerated short-read alignment, derived from bwa-mem2"
authors = ["Fulcrum Genomics"]
language = "en"
text-direction = "ltr"
src = "src"

[build]
build-dir = "book"

[output.html]
additional-css = ["theme/custom.css"]
additional-js = ["theme/sidebar-brand.js"]
git-repository-url = "https://github.com/fg-labs/bwa-mem3"
edit-url-template = "https://github.com/fg-labs/bwa-mem3/edit/main/docs/{path}"
no-section-label = true
default-theme = "navy"
preferred-dark-theme = "navy"

[output.html.search]
enable = true

[output.html.fold]
enable = true
level = 1

[output.html.playground]
editable = false
runnable = false

[preprocessor.mermaid]
command = "mdbook-mermaid"
